        - generic [ref=f12e178]:
          - paragraph [ref=f12e179]: How to read itEach slice is a season’s share of total production. Kharif is the monsoon-sown season, Rabi the winter-sown season, and “Whole Year” holds perennial crops such as coconut and sugarcane that are harvested through the year.
          - paragraph [ref=f12e180]: What it means nowWhole Year accounts for 95.2%, followed by Kharif at 2.9%. 3 of 6 seasons each contribute under 1%.
          - paragraph [ref=f12e181]: Keep in mindA very large “Whole Year” slice is usually driven by coconut. Switch on Exclude coconut in the filter bar to see how Kharif and Rabi, the true cropping seasons, compare.
