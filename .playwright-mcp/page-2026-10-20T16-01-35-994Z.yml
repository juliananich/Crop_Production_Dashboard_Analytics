        - generic [ref=f12e154]:
          - paragraph [ref=f12e155]: How to read itEach point adds up every crop-district-season record reported for that crop year, so the line is the total recorded production for your current selection. A rising line means more recorded output; the shaded area under it makes the overall scale easy to compare from year to year.
          - paragraph [ref=f12e156]: What it means nowOutput peaked in 2011 at 14.31B, which is 1.9× the average year (7.43B). It moved from 851.23M in 1997 to 6.94M in 2015, and the lowest year was 2015 at 6.94M.
          - paragraph [ref=f12e157]: Keep in mindIn this dataset the first and last crop years have far fewer records than the middle years, so the line drops sharply at both edges. That reflects incomplete reporting, not a real collapse in farming.
