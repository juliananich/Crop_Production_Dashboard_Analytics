    - paragraph [ref=e89]: "Ratings are rules of thumb. Dependence: top crop over 50% is high, 30–50% moderate. Concentration: top 3 states over 75% is high, 50–75% concentrated. Stability: variation under 0.15 is steady, 0.15–0.30 variable, above 0.30 volatile. Growth: within ±2% a year counts as flat."
    - generic [ref=e90]:
      - heading "Key takeaways for the current selection" [level=4] [ref=e91]
      - list [ref=e92]:
        - listitem [ref=e93]: "Crop risk: Coconut supplies 92.1% of recorded production and 1 crop cover 80%. A shock to this one crop would move the whole total, so it is the first thing to monitor."
        - listitem [ref=e94]: "Regional risk: Kerala leads with 69.3%; the top 3 states hold 90.2%. Supply is geographically concentrated, so a regional drought or flood matters nationally."
        - listitem [ref=e95]: "Momentum: production grew about 2.5% a year between 1998 and 2014, and peaked in 2011."
        - listitem [ref=e96]: "Reliability: yearly output varies by 0.26 (variable), so plan buffers generously."
