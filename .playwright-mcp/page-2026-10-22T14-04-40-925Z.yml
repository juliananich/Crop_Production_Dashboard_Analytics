      - list [ref=f1e92]:
        - listitem [ref=f1e93]: "Crop risk: Coconut supplies 92.1% of recorded production and 1 crop cover 80%. A shock to this one crop would move the whole total, so it is the first thing to monitor."
        - listitem [ref=f1e94]: "Regional risk: Kerala leads with 69.3%; the top 3 states hold 90.2%. Supply is geographically concentrated, so a regional drought or flood matters nationally."
        - listitem [ref=f1e95]: "Momentum: production grew about 2.5% a year between 1998 and 2014, and peaked in 2011."
        - listitem [ref=f1e96]: "Reliability: yearly output varies by 0.26 (variable), so plan buffers generously."
