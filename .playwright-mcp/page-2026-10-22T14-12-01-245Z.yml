      - list [ref=f2e95]:
        - listitem [ref=f2e96]: "Crop risk: Coconut supplies 92.1% of recorded production and 1 crop cover 80%. A shock to this one crop would move the whole total, so it is the first thing to monitor."
        - listitem [ref=f2e97]: "Regional risk: Kerala leads with 69.3%; the top 3 states hold 90.2%. Supply is geographically concentrated, so a regional drought or flood matters nationally."
